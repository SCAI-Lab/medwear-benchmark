# Loaded via CONTAINERS_CONF_OVERRIDE by bench/lib/common.sh inside Slurm jobs.
# cgroupfs keeps conmon and the container processes in the cgroup of the
# calling process (the Slurm job step) instead of a systemd user scope.
# Rootless podman cannot create sub-cgroups there, so containers share the job
# cgroup; per-container CPU/memory is sampled from /proc (profile_containers.py).
[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"

[containers]
cgroups = "disabled"
